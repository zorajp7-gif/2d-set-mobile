<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2D SET INDEX App</title>
<link rel="manifest" href="manifest.json">
    
    <style>
        :root {
            --bg-color: #0d1117;
            --card-bg: #161b22;
            --accent-color: #f0b90b;
            --text-primary: #ffffff;
            --text-secondary: #8b949e;
            --border-color: #30363d;
            --danger-color: #f85149;
            --success-color: #2ea043;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 480px;
            min-height: 100vh;
            background-color: var(--bg-color);
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            padding-bottom: 30px;
        }

        .header {
            background-color: var(--card-bg);
            padding: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo-area {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .logo-box {
            background: var(--accent-color);
            color: #000;
            font-weight: bold;
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 18px;
        }

        .status-badge {
            font-size: 12px;
            padding: 4px 8px;
            border-radius: 20px;
            font-weight: bold;
        }

        .status-live {
            background-color: var(--success-color);
            color: white;
        }

        .status-closed {
            background-color: var(--danger-color);
            color: white;
        }

        .content {
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 15px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .card-title {
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--accent-color);
        }

        .notice-box {
            background: rgba(248, 81, 73, 0.1);
            border: 1px solid var(--danger-color);
            padding: 10px;
            border-radius: 8px;
            font-size: 13px;
            color: #ff7b72;
            text-align: center;
        }

        .live-number {
            text-align: center;
            padding: 25px 10px;
        }

        .live-number-label {
            font-size: 14px;
            color: var(--text-secondary);
            margin-bottom: 10px;
        }

        .live-number-value {
            font-size: 52px;
            font-weight: bold;
            color: var(--accent-color);
        }
    </style>
</head>

<body>

<div class="container">

    <!-- Header -->
    <div class="header">

        <div class="logo-area">

            <div class="logo-box">
                2D
            </div>

            <div>
                <div style="font-weight: bold; font-size: 15px;">
                    2D SET INDEX
                </div>

                <div id="date-time"
                     style="font-size: 11px; color: var(--text-secondary);">
                    Loading...
                </div>
            </div>

        </div>

        <div id="market-status-badge"
             class="status-badge status-closed">
            CLOSED
        </div>

    </div>


    <div class="content">

        <!-- Market Status Notice -->
        <div id="market-notice"
             class="notice-box">

            စနေ၊ တနင်္ဂနွေ ပိတ်ရက်ဖြစ်သဖြင့်
            ဈေးကွက်ပိတ်ထားပါသည်။

        </div>


        <!-- Live 2D Card -->
        <div class="card">

            <div class="card-title">
                📊 2D SET INDEX
            </div>

            <div class="live-number">

                <div class="live-number-label">
                    လက်ရှိ 2D ဂဏန်း
                </div>

                <div class="live-number-value"
                     id="live-number">
                    --
                </div>

            </div>

        </div>

    </div>

</div>


<script>

    function checkMarketStatus() {

        const now = new Date();

        const day = now.getDay();

        const badge =
            document.getElementById('market-status-badge');

        const notice =
            document.getElementById('market-notice');


        // Saturday / Sunday
        if (day === 0 || day === 6) {

            badge.className =
                "status-badge status-closed";

            badge.innerText =
                "WEEKEND CLOSED";

            notice.style.display =
                "block";

            notice.innerText =
                "စနေ၊ တနင်္ဂနွေ ပိတ်ရက်ဖြစ်သဖြင့် LIVE တိုက်ရိုက် မရှိပါ။";

        } else {

            badge.className =
                "status-badge status-live";

            badge.innerText =
                "LIVE OPEN";

            notice.style.display =
                "none";
        }


        // Date & Time
        document.getElementById('date-time').innerText =
            now.toLocaleString();

    }


    // Initialize
    setInterval(checkMarketStatus, 1000);

    checkMarketStatus();

</script>

</body>
</html>
